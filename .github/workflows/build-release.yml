name: Build R (Linux spike)

# Phase 1a spike: proves the build + relocatability pipeline across distro families/versions and R versions; uploads artifacts only, does not publish a Release yet.

on:
  workflow_dispatch:
    inputs:
      r_versions:
        description: 'JSON array of R versions to build, e.g. ["4.4.2","4.3.3"] -- old versions are already published from earlier runs, so only override this when you actually need a fresh build of one'
        required: false
        default: '["4.4.2"]'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'scripts/patch-relocatable.py'

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        r_version: ${{ fromJSON(github.event.inputs.r_versions || '["4.4.2"]') }}
        distro:
          - { name: ubuntu-22.04, image: 'ubuntu:22.04', family: debian }
          - { name: ubuntu-24.04, image: 'ubuntu:24.04', family: debian }
          - { name: debian-11, image: 'debian:11', family: debian }
          - { name: debian-12, image: 'debian:12', family: debian }
          - { name: almalinux-8, image: 'almalinux:8', family: rhel }
          - { name: almalinux-9, image: 'almalinux:9', family: rhel }
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro.image }}
    env:
      R_VERSION: ${{ matrix.r_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Debian/Ubuntu family)
        if: matrix.distro.family == 'debian'
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential xorg-dev gfortran \
            libpng-dev libjpeg-dev liblzma-dev libpcre2-dev \
            libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libcairo2-dev \
            tcl-dev tk-dev libhdf5-dev libblosc-dev libhiredis-dev \
            libopenmpi-dev liblzo2-dev libomp-dev libreadline-dev \
            bzip2 libbz2-dev xz-utils curl ca-certificates python3

      - name: Install build dependencies (RHEL family)
        if: matrix.distro.family == 'rhel'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb 2>/dev/null || dnf config-manager --set-enabled powertools 2>/dev/null || true
          dnf install -y --allowerasing \
            gcc gcc-c++ gcc-gfortran make which \
            libX11-devel libXext-devel libXrender-devel libXtst-devel libXt-devel \
            libpng-devel libjpeg-turbo-devel xz-devel pcre2-devel \
            libcurl-devel harfbuzz-devel fribidi-devel cairo-devel \
            tcl-devel tk-devel readline-devel \
            bzip2 bzip2-devel xz curl ca-certificates python3
          dnf install -y --skip-broken hdf5-devel c-blosc-devel hiredis-devel openmpi-devel lzo-devel || true

      - name: Download R source
        run: |
          curl -fLO "https://cran.r-project.org/src/base/R-4/R-${R_VERSION}.tar.gz"
          echo "Source tarball sha256 (record this and pin it explicitly once verified):"
          sha256sum "R-${R_VERSION}.tar.gz"
          tar -xzf "R-${R_VERSION}.tar.gz"

      - name: Configure and build
        working-directory: R-${{ env.R_VERSION }}
        env:
          CPPFLAGS: -I/usr/include -I/usr/include/xorg
          LDFLAGS: -L/usr/lib -L/usr/lib/xorg
          CFLAGS: -I/usr/include
          TCL_LIBRARY: /usr/lib/tcltk
          TK_LIBRARY: /usr/lib/tcltk
          PKG_CONFIG_PATH: /usr/lib/pkgconfig
          C_INCLUDE_PATH: /usr/include
          LIBRARY_PATH: /usr/lib
        run: |
          ./configure --prefix=/opt/r-portable-build --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j"$(nproc)"

      - name: Install to staging prefix
        working-directory: R-${{ env.R_VERSION }}
        run: |
          mkdir -p /opt/r-portable-build
          make install

      - name: Make R launchers relocatable (patches bin/R and lib/R/bin/R in place, replaces Rscript with a thin wrapper)
        run: python3 scripts/patch-relocatable.py /opt/r-portable-build

      - name: Relocatability test -- move the tree and run R from an unrelated path, no env var overrides
        run: |
          mkdir -p /tmp/relocated/some/other/path
          mv /opt/r-portable-build/* /tmp/relocated/some/other/path/
          RESULT=$(/tmp/relocated/some/other/path/bin/Rscript -e 'cat(R.version.string)')
          echo "Relocated R reports: $RESULT"
          echo "$RESULT" | grep -q "R version ${R_VERSION}" || (echo "::error::Relocated R did not report the expected version -- relocation is still broken" && exit 1)

      - name: Package archive
        run: |
          cd /tmp/relocated/some/other/path
          tar -cJf "$GITHUB_WORKSPACE/r-portable-${R_VERSION}-${{ matrix.distro.name }}-x86_64.tar.xz" .

      - name: Generate checksum
        run: |
          sha256sum "r-portable-${R_VERSION}-${{ matrix.distro.name }}-x86_64.tar.xz" > "r-portable-${R_VERSION}-${{ matrix.distro.name }}-x86_64.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-portable-${{ env.R_VERSION }}-${{ matrix.distro.name }}-x86_64
          path: |
            r-portable-*.tar.xz
            r-portable-*.tar.xz.sha256
