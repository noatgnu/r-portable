name: Build R (Linux spike)

# Phase 1a spike: proves the build + relocatability pipeline; uploads an artifact only, does not publish a Release yet.

on:
  workflow_dispatch:
    inputs:
      r_version:
        description: 'R version to build (must exist under https://cran.r-project.org/src/base/R-4/)'
        required: true
        default: '4.4.2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    env:
      R_VERSION: ${{ github.event.inputs.r_version || '4.4.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xorg-dev gfortran \
            libpng-dev libjpeg-dev liblzma-dev libpcre2-dev \
            libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libcairo2-dev \
            tcl-dev tk-dev libhdf5-dev libblosc-dev libhiredis-dev \
            libopenmpi-dev liblzo2-dev libomp-dev libreadline-dev \
            bzip2 xz-utils

      - name: Download R source
        run: |
          curl -fLO "https://cran.r-project.org/src/base/R-4/R-${R_VERSION}.tar.gz"
          echo "Source tarball sha256 (record this and pin it explicitly once verified):"
          sha256sum "R-${R_VERSION}.tar.gz"
          tar -xzf "R-${R_VERSION}.tar.gz"

      - name: Configure and build (matches cauldron-go's proven build-env-linux.yml flags)
        working-directory: R-${{ env.R_VERSION }}
        env:
          CPPFLAGS: -I/usr/include -I/usr/include/xorg
          LDFLAGS: -L/usr/lib -L/usr/lib/xorg
          CFLAGS: -I/usr/include
          TCL_LIBRARY: /usr/lib/tcltk
          TK_LIBRARY: /usr/lib/tcltk
          PKG_CONFIG_PATH: /usr/lib/pkgconfig
          C_INCLUDE_PATH: /usr/include
          LIBRARY_PATH: /usr/lib
        run: |
          ./configure --prefix=/opt/r-portable-build --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j"$(nproc)"

      - name: Install to staging prefix
        working-directory: R-${{ env.R_VERSION }}
        run: |
          sudo mkdir -p /opt/r-portable-build
          sudo chown "$USER" /opt/r-portable-build
          make install

      - name: Diagnose binary layout and library dependencies before wrapping
        run: |
          echo "=== find all ELF binaries under the install prefix ==="
          find /opt/r-portable-build -type f -exec sh -c 'file "$1" | grep -q ELF && echo "$1"' _ {} \;
          echo "=== ldd on bin/Rscript ==="
          ldd /opt/r-portable-build/bin/Rscript || true
          echo "=== ldd on bin/R (if a real binary, not a script) ==="
          ldd /opt/r-portable-build/bin/R 2>&1 || true
          echo "=== readelf -d (dynamic section incl. RPATH/RUNPATH) on Rscript ==="
          readelf -d /opt/r-portable-build/bin/Rscript || true
          echo "=== contents of lib/R/bin and lib/R/bin/exec ==="
          find /opt/r-portable-build/lib/R/bin -maxdepth 2

      - name: Wrap R/Rscript so R_HOME and LD_LIBRARY_PATH resolve relative to the binary's own location
        run: |
          cd /opt/r-portable-build/bin
          for bin in R Rscript; do
            if [ -f "$bin" ] && [ ! -f "$bin.real" ]; then
              mv "$bin" "$bin.real"
              printf '#!/bin/sh\nDIR=$(cd "$(dirname "$0")" && pwd)\nexport R_HOME="$DIR/../lib/R"\nexport LD_LIBRARY_PATH="$DIR/../lib/R/lib:$LD_LIBRARY_PATH"\nexec "$DIR/%s.real" "$@"\n' "$bin" > "$bin"
              chmod +x "$bin"
            fi
          done

      - name: Relocatability test -- move the tree and run R from an unrelated path
        run: |
          sudo apt-get install -y --no-install-recommends strace
          mkdir -p /tmp/relocated/some/other/path
          mv /opt/r-portable-build/* /tmp/relocated/some/other/path/
          echo "=== strace of the relocated Rscript.real, with the same env vars the wrapper sets ==="
          R_HOME="/tmp/relocated/some/other/path/lib/R" \
          LD_LIBRARY_PATH="/tmp/relocated/some/other/path/lib/R/lib" \
          strace -f -e trace=execve,openat,open -o /tmp/strace.log /tmp/relocated/some/other/path/bin/Rscript.real -e 'cat(R.version.string)' || true
          grep -E "ENOENT|execve" /tmp/strace.log | tail -100
          echo "=== normal run via the wrapper (bin/Rscript) ==="
          RESULT=$(/tmp/relocated/some/other/path/bin/Rscript -e 'cat(R.version.string)')
          echo "Relocated R reports: $RESULT"
          echo "$RESULT" | grep -q "R version ${R_VERSION}" || (echo "::error::Relocated R did not report the expected version -- relocation is likely broken and needs a path-patching step" && exit 1)

      - name: Package archive
        run: |
          cd /tmp/relocated/some/other/path
          tar -cJf "$GITHUB_WORKSPACE/r-portable-${R_VERSION}-linux-x86_64.tar.xz" .

      - name: Generate checksum
        run: |
          sha256sum "r-portable-${R_VERSION}-linux-x86_64.tar.xz" > "r-portable-${R_VERSION}-linux-x86_64.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-portable-${{ env.R_VERSION }}-linux-x86_64
          path: |
            r-portable-*.tar.xz
            r-portable-*.tar.xz.sha256
