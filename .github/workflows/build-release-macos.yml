name: Build R (macOS)

# Phase 1b: builds R from source on native GitHub-hosted macOS arm64 runners, applies the same relocatability patch as Linux, and verifies it by moving the built tree before running Rscript.

on:
  workflow_dispatch:
    inputs:
      r_versions:
        description: 'JSON array of R versions to build, e.g. ["4.4.2","4.3.3"]'
        required: false
        default: '["4.4.2"]'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-release-macos.yml'
      - 'scripts/patch-relocatable.py'

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        r_version: ${{ fromJSON(github.event.inputs.r_versions || '["4.4.2"]') }}
    runs-on: macos-latest
    env:
      R_VERSION: ${{ matrix.r_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Homebrew, matches cauldron-go's proven build-env-darwin-arm64.yml)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask xquartz
          brew install gfortran pkg-config libpng jpeg xz pcre2 curl harfbuzz fribidi libx11 libxext libxrender libxtst cairo tcl-tk hdf5 c-blosc hiredis open-mpi lzo bzip2
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
          {
            echo "CPPFLAGS=-I$(brew --prefix)/include -I/opt/X11/include -I$(brew --prefix jpeg)/include"
            echo "LDFLAGS=-L/opt/X11/lib -L$(brew --prefix jpeg)/lib -L$(brew --prefix lzo)/lib -L$(brew --prefix)/lib"
            echo "CFLAGS=-I$(brew --prefix lzo)/include"
            echo "TCL_LIBRARY=$(brew --prefix tcl-tk)/lib"
            echo "TK_LIBRARY=$(brew --prefix tcl-tk)/lib"
            echo "PKG_CONFIG_PATH=$(brew --prefix jpeg)/lib/pkgconfig"
            echo "LIBRARY_PATH=$(brew --prefix)/lib"
          } >> "$GITHUB_ENV"

      - name: Download R source
        run: |
          curl -fLO "https://cran.r-project.org/src/base/R-4/R-${R_VERSION}.tar.gz"
          echo "Source tarball sha256 (record this and pin it explicitly once verified):"
          shasum -a 256 "R-${R_VERSION}.tar.gz"
          tar -xzf "R-${R_VERSION}.tar.gz"

      - name: Configure and build (matches cauldron-go's proven build-env-darwin-arm64.yml flags)
        working-directory: R-${{ env.R_VERSION }}
        run: |
          ./configure --prefix=/opt/r-portable-build --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j"$(sysctl -n hw.ncpu)"

      - name: Install to staging prefix
        working-directory: R-${{ env.R_VERSION }}
        run: |
          sudo mkdir -p /opt/r-portable-build
          sudo chown "$USER" /opt/r-portable-build
          make install

      - name: Run R's own regression test suite to verify the build is functionally correct, not just installable
        working-directory: R-${{ env.R_VERSION }}
        run: make check

      - name: Diagnose dylib dependencies before patching
        run: |
          otool -L /opt/r-portable-build/lib/R/bin/exec/R 2>&1 || true
          otool -L /opt/r-portable-build/lib/R/lib/libR.dylib 2>&1 || true

      - name: Make R launchers relocatable (patches bin/R and lib/R/bin/R in place, replaces Rscript with a thin wrapper)
        run: python3 scripts/patch-relocatable.py /opt/r-portable-build

      - name: Relocatability test -- move the tree and run R from an unrelated path, no env var overrides
        run: |
          mkdir -p /tmp/relocated/some/other/path
          mv /opt/r-portable-build/* /tmp/relocated/some/other/path/
          RESULT=$(/tmp/relocated/some/other/path/bin/Rscript -e 'cat(R.version.string)')
          echo "Relocated R reports: $RESULT"
          echo "$RESULT" | grep -q "R version ${R_VERSION}" || (echo "::error::Relocated R did not report the expected version -- relocation is broken on macOS" && exit 1)

      - name: Package archive
        run: |
          cd /tmp/relocated/some/other/path
          tar -cJf "$GITHUB_WORKSPACE/r-portable-${R_VERSION}-macos-arm64.tar.xz" .

      - name: Generate checksum
        run: |
          shasum -a 256 "r-portable-${R_VERSION}-macos-arm64.tar.xz" > "r-portable-${R_VERSION}-macos-arm64.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-portable-${{ env.R_VERSION }}-macos-arm64
          path: |
            r-portable-*.tar.xz
            r-portable-*.tar.xz.sha256
